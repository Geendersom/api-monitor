name: Bug Report
description: Reportar um problema ou comportamento inesperado
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug. Quanto mais detalhes você fornecer, mais rápido poderemos investigar.

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Descreva o problema de forma clara e objetiva.
      placeholder: "Ex.: A API retorna erro ao iniciar após npm install."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste os passos necessários para reproduzir o comportamento.
      placeholder: |
        1. Clone o repositório
        2. Execute npm install
        3. Execute npm run dev --workspace=api
        4. Observe o erro
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      description: O que aconteceu de fato?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Informe versões relevantes do ambiente.
      placeholder: |
        - SO: macOS / Linux / Windows
        - Node.js: 24.x
        - npm: 11.x
        - Branch/commit: main / abc1234
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Cole trechos de logs, mensagens de erro ou capturas de tela (se aplicável).
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Pesquisei Issues existentes e não encontrei um reporte duplicado.
          required: true
        - label: Testei com a versão mais recente da branch principal, quando possível.
          required: false
